[package]
name = "server"
version = "0.2.0"
edition = "2024"
authors = ["Jeffery D. Mitchell", "<crusty.rustacean@gmail.com>"]
description = "The server powering jeff-mitchell.dev"
readme = "README.md"
repository = "https://github.com/crustyrustacean/jeff-mitchell-dev.git"
license = "MIT"
publish = false

[[bin]]
name = "server"
path = "src/bin/main.rs"

[dependencies]
actix-files = "0.7.5"
actix-web = { version = "4", default-features = false }
anyhow = "1"
config = { version = "0.15", default-features = false, features = ["yaml"] }
datastar = { version = "0.4.2", features = ["actix-web"] }
reqwest = { version = "0.13", features = [ "json" ] }
serde = { version = "1", features = ["derive"] }
serde-aux = "4"
serde_json = "1"
thiserror = "2"
tera = { version = "2.4.0", features = [ "fast", "glob_fs" ] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-actix-web = "0.7"
tracing-log = "0.2"
tracing-bunyan-formatter = "0.3"
tracing-subscriber = { version = "0.3", features = ["registry", "env-filter"] }

[profile.release]
strip = true
lto = "thin"
