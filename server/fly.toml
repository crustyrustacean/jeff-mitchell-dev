app = 'jeff-mitchell-dev-server'
primary_region = 'den'

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    timeout = '5s'
    path = '/api/v1/health_check'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
