<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{{ site.name }}{% endblock %}</title>
    <meta
      name="description"
      content="{% block description %}{{ site.description }}{% endblock %}"
    />
    <meta name="author" content="{{ site.author }}" />
    <link
      rel="canonical"
      href="{{ site.base_url }}{{ page?.path | default(value='/') }}"
    />
    <meta name="robots" content="index, follow" />
    <meta
      property="og:type"
      content="{% block og_type %}website{% endblock %}"
    />
    <meta
      property="og:title"
      content="{% block og_title %}{{ site.name }}{% endblock %}"
    />
    <meta
      property="og:description"
      content="{% block og_description %}{{ site.description }}{% endblock %}"
    />
    <meta
      property="og:url"
      content="{{ site.base_url }}{{ page?.path | default(value='/') }}"
    />
    <meta property="og:site_name" content="{{ site.name }}" />
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="{% block twitter_title %}{{ site.name }}{% endblock %}"
    />
    <meta
      name="twitter:description"
      content="{% block twitter_description %}{{ site.description }}{% endblock %}"
    />
    <link rel="icon" type="image/png" href="/static/favicon.png" />
    <link rel="stylesheet" href="/css/main.css" />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="{{ site.name }}"
      href="/feed.xml"
    />
    <!-- Privacy-friendly analytics by Plausible -->
    <script
      async
      src="https://plausible.io/js/pa-tAndaMxuq5M8kAbhiDfcv.js"
    ></script>
    <script>
      ((window.plausible =
        window.plausible ||
        function () {
          (plausible.q = plausible.q || []).push(arguments);
        }),
        (plausible.init =
          plausible.init ||
          function (i) {
            plausible.o = i || {};
          }));
      plausible.init();
    </script>
  </head>
  <body>
    <header>
      <div class="header-row">
        <div>
          <h1><a href="/">{{ site.name }}</a></h1>
          <h2>{{ site.description }}</h2>
        </div>
        <div class="header-actions">
          <div class="search-container">
            {{ island(component="SearchBox", class="site-search") | safe }}
          </div>
          <button
            class="theme-toggle"
            onclick="toggleTheme()"
            aria-label="Toggle dark mode"
          ></button>
        </div>
      </div>
    </header>
    <main>{% block content %}{% endblock %}</main>
    <footer>
      <div class="footer-inner">
        <p class="footer-copyright">&copy; {{ now.year }} Jeffery D. Mitchell</p>
        <nav class="footer-nav" aria-label="Footer">
          <a href="/about">About Me</a>
          <a href="/blogroll">Blogroll</a>
          <a href="/projects">Projects</a>
          <a href="https://crusty-metallian.net">Music</a>
          <a href="https://github.com/crustyrustacean" target="_blank" rel="noopener noreferrer">GitHub</a>
          <a href="https://textlog.cc/u/crustyrustacean" target="_blank" rel="noopener noreferrer">textlog</a>
          <a href="/feed.xml">RSS</a>
        </nav>
        <p class="footer-powered">Built with <a href="https://get-taxus.org" target="_blank" rel="noopener noreferrer">Taxus</a></p>
      </div>
    </footer>
    <script type="module">
      import init from "/wasm/client.js";
      import * as bindings from "/wasm/client.js";
      const wasm = await init({ module_or_path: "/wasm/client_bg.wasm" });
      window.wasmBindings = bindings;
      bindings.hydrate_islands();
    </script>
    <script src="/static/scripts.js"></script>
  </body>
</html>
