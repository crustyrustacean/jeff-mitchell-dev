name: CI / CD

on:
  pull_request:
    branches: [trunk]
  push:
    branches: [trunk]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: Deployment target after CI passes
        type: choice
        default: auto
        options:
          - auto
          - none
          - site
          - server
          - all

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.set-outputs.outputs.site }}
      server: ${{ steps.set-outputs.outputs.server }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name != 'workflow_dispatch'

      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            site:
              - 'content/**'
              - 'templates/**'
              - 'styles/**'
              - 'scripts/**'
              - 'static/**'
              - 'site.toml'
              - 'tsconfig.json'
              - 'wrangler.toml'
              - 'justfile'
              - '.github/workflows/ci-cd.yml'
            server:
              - 'server/**'
              - 'justfile'
              - '.github/workflows/ci-cd.yml'

      - name: Set change outputs
        id: set-outputs
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "site=true" >> "$GITHUB_OUTPUT"
            echo "server=true" >> "$GITHUB_OUTPUT"
          else
            echo "site=${{ steps.filter.outputs.site }}" >> "$GITHUB_OUTPUT"
            echo "server=${{ steps.filter.outputs.server }}" >> "$GITHUB_OUTPUT"
          fi

  ci-site:
    name: CI Site (Taxus)
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Read pinned taxus revision
        id: taxus-rev
        run: echo "rev=$(just --evaluate taxus_rev)" >> "$GITHUB_OUTPUT"

      - name: Cache taxus binary
        id: cache-taxus
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/taxus
          key: taxus-${{ runner.os }}-${{ steps.taxus-rev.outputs.rev }}

      - name: Install taxus
        if: steps.cache-taxus.outputs.cache-hit != 'true'
        run: just install-taxus

      - uses: Swatinem/rust-cache@v2

      - name: Build and verify static site
        run: just ci-site

      - name: Upload built site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

  ci-server:
    name: CI Server (Actix Web + Docker)
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "server -> target"

      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-deny

      - name: Run server CI checks
        run: just ci-server

      - uses: docker/setup-buildx-action@v4

      - name: Validate server Docker image build
        uses: docker/build-push-action@v7
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ci-gate:
    name: CI Gate
    needs: [changes, ci-site, ci-server]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all triggered CI jobs succeeded
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "changes job did not succeed (${{ needs.changes.result }})" >&2
            exit 1
          fi
          case "${{ needs.ci-site.result }}" in
            success|skipped) ;;
            *)
              echo "ci-site failed (${{ needs.ci-site.result }})" >&2
              exit 1
              ;;
          esac
          case "${{ needs.ci-server.result }}" in
            success|skipped) ;;
            *)
              echo "ci-server failed (${{ needs.ci-server.result }})" >&2
              exit 1
              ;;
          esac

  deploy-site:
    name: Deploy Site to Cloudflare Pages
    needs: [changes, ci-gate]
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/trunk' &&
      needs.ci-gate.result == 'success' &&
      (
        (github.event_name == 'push' && needs.changes.outputs.site == 'true') ||
        (github.event_name == 'workflow_dispatch' && (inputs.deploy_target == 'site' || inputs.deploy_target == 'all' || inputs.deploy_target == 'auto'))
      )
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-cloudflare-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: site-dist
          path: dist

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler pages deploy dist/ --project-name=jeff-mitchell-dev --branch=trunk
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-server:
    name: Deploy Server to Fly.io
    needs: [changes, ci-gate]
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/trunk' &&
      needs.ci-gate.result == 'success' &&
      (
        (github.event_name == 'push' && needs.changes.outputs.server == 'true') ||
        (github.event_name == 'workflow_dispatch' && (inputs.deploy_target == 'server' || inputs.deploy_target == 'all' || inputs.deploy_target == 'auto'))
      )
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-fly-server
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        working-directory: server
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Smoke check deployed health endpoint
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors \
            https://api.jeff-mitchell.dev/api/v1/health_check
